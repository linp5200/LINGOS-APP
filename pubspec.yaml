name: lingos_app
description: "LING OS App - Flutter 重写版（协议 v3）"
publish_to: 'none'
version: 0.2.0+11  # App 0.2.0（统一 LLM 调用层 + 上下文压缩 + 工具错误 17 类 + 语音系统 + 模型切换）

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  path_provider: ^2.1.3
  go_router: ^14.2.0
  web_socket_channel: ^3.0.0
  dio: ^5.4.0
  crypto: ^3.0.3
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.2.2
  flutter_secure_storage: ^9.2.2
  permission_handler: ^11.3.1 # 【A4修复】真实 Android 授权
  shizuku_api: ^1.2.2 # 【A5】Shizuku 特权——AI 经 adb 执行命令
  record: ^7.1.1 # 【0.2.0】语音——录音（STT 输入）
  audioplayers: ^6.8.1 # 【0.2.0】语音——播放（TTS 输出）

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
