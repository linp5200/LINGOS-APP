name: lingos_app
description: "LING OS App - Flutter 重写版（协议 v3）"
publish_to: 'none'
version: 0.4.3+19  # App 0.4.3（设置改回子菜单导航+关于版本图图标）

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  path_provider: ^2.1.3
  go_router: ^14.2.0
  web_socket_channel: ^3.0.0
  dio: ^5.4.0
  crypto: ^3.0.3
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.2.2
  flutter_secure_storage: ^9.2.2
  permission_handler: ^11.3.1 # 【A4修复】真实 Android 授权
  shizuku_api: ^1.2.2 # 【A5】Shizuku 特权——AI 经 adb 执行命令
  record: ^6.1.1 # 【0.2.0】语音——录音（STT 输入）——兼容 Flutter ≥3.24
  audioplayers: ^6.1.0 # 【0.2.0】语音——播放（TTS 输出）——兼容 Flutter ≥3.13
  flutter_tts: ^4.2.5 # 【0.2.1 #10】设备本地 TTS（降级链末端——服务端无提供商/espeak 时兜底）
  speech_to_text: ^7.4.0 # 【0.2.1 #10】设备本地 STT（降级链末端——服务端无提供商时兜底）
  sqflite_sqlcipher: ^3.4.1 # 【0.2.1 #1/#Q3】离线缓存主存储（sqlcipher 加密——密钥 Android Keystore）
  path: ^1.9.0 # 【0.2.1 #1】路径拼接（离线缓存模块）

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
