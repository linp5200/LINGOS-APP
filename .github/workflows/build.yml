name: 编译 LING OS App（Flutter）

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      - name: 获取依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze

      - name: 编译 Release APK
        run: flutter build apk --release

      - name: 提取版本号（先生四段式——非 pubspec semver）
        id: version
        run: |
          VERSION=$(echo "all_appV:2.0.0.3_serverV:5.1.0.0-rc0.1_LINGV:(5.0.0.0~5.1.0.0).apk" | grep -oP 'appV:\K[^_]+')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "版本: $VERSION"

      - name: 重命名 APK（先生命名规范）
        run: |
          mkdir -p /tmp/release
          cp build/app/outputs/flutter-apk/app-release.apk \
            "/tmp/release/all_appV:2.0.0.3_serverV:5.1.0.0-rc0.1_LINGV:(5.0.0.0~5.1.0.0).apk"
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/release/app-release-safe.apk

      - name: 发布到 GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/release/*.apk
          name: LING OS App ${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          generate_release_notes: false

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: /tmp/release/app-release-safe.apk

  build_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true
      - name: 安装 Linux 构建依赖
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libjsoncpp-dev
      - name: 获取依赖
        run: flutter pub get
      - name: 构建 Linux
        run: flutter build linux --release
      - name: 打包
        run: |
          mkdir -p /tmp/linux_out
          tar -czf /tmp/linux_out/lingos_app_linux.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: lingos-linux
          path: /tmp/linux_out/lingos_app_linux.tar.gz

  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true
      - name: 获取依赖
        run: flutter pub get
      - name: 构建 Windows
        run: flutter build windows --release
      - name: 打包
        shell: powershell
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath lingos_app_windows.zip
          mkdir -p /tmp/win_out
          Move-Item lingos_app_windows.zip /tmp/win_out/
      - uses: actions/upload-artifact@v4
        with:
          name: lingos-windows
          path: /tmp/win_out/lingos_app_windows.zip
