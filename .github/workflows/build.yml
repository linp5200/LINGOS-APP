name: 编译 LING OS App（Flutter）

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      - name: 获取依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze

      - name: 提取版本号（SemVer——pubspec）
        id: version
        run: |
          VERSION=$(grep -oP '^version:\s*\K[^+\s]+' pubspec.yaml)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "版本: $VERSION"

      - name: 编译 Release APK（ABI 拆分——先生格式：LINGOS_<架构>_android_beta_<版本>.apk）
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release
          mkdir -p /tmp/release
          V=$(grep -oP '^version:\s*\K[^+\s]+' pubspec.yaml)
          cd build/app/outputs/flutter-apk
          [ -f app-arm64-v8a-release.apk ] && cp app-arm64-v8a-release.apk "/tmp/release/LINGOS_arm64-v8a_android_beta_${V}.apk"
          [ -f app-armeabi-v7a-release.apk ] && cp app-armeabi-v7a-release.apk "/tmp/release/LINGOS_armeabi-v7a_android_beta_${V}.apk"
          [ -f app-x86_64-release.apk ] && cp app-x86_64-release.apk "/tmp/release/LINGOS_x86_64_android_beta_${V}.apk"
          cp app-release.apk "/tmp/release/LINGOS_all_android_beta_${V}.apk"
          cp app-release.apk /tmp/release/app-release-safe.apk

      - name: 发布到 GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/release/*.apk
          name: LING OS App ${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          generate_release_notes: false
          # 【0.2.1 修复】versionCode 修正后重新构建——更新已有 v0.2.1 release 资产
          update_release: true
          overwrite_files: true

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: /tmp/release/app-release-safe.apk

  build_linux:
    runs-on: ubuntu-latest
    continue-on-error: true  # 【0.1.9】桌面端构建不阻塞 Android 发布
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true
      - name: 安装 Linux 构建依赖
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libjsoncpp-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpulse-dev
      - name: 获取依赖
        run: flutter pub get
      - name: 构建 Linux
        run: flutter build linux --release
      - name: 打包
        run: |
          mkdir -p /tmp/linux_out
          V=$(grep -oP '^version:\s*\K[^+\s]+' pubspec.yaml)
          tar -czf /tmp/linux_out/linux_beta_${V}.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: lingos-linux
          path: /tmp/linux_out/lingos_app_linux.tar.gz

  build_windows:
    runs-on: windows-latest
    continue-on-error: true  # 【0.1.9】桌面端构建不阻塞 Android 发布（VS18 STL 兼容性问题）
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true
      - name: 获取依赖
        run: flutter pub get
      - name: 构建 Windows
        run: flutter build windows --release
      - name: 打包
        shell: powershell
        run: |
          $V = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | ForEach-Object { $_.Matches[0].Groups[1].Value }
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath windows_beta_$V.zip
          mkdir -p /tmp/win_out
          Move-Item windows_beta_$V.zip /tmp/win_out/
      - uses: actions/upload-artifact@v4
        with:
          name: lingos-windows
          path: /tmp/win_out/lingos_app_windows.zip
